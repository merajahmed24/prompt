<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Professional Multi-Platform Prompt Generator tool for social media content creators. Generate Pinterest, Facebook, Instagram, Shorts, Video Descriptions, Blog Posts and SEO Keywords." />
  <meta name="author" content="Your Name or Brand" />
  <title>🧰 Pro Prompt Generator Tool</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f0f4f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .container {
      background: #1e2a38;
      width: 100%;
      max-width: 900px;
      border-radius: 22px;
      padding: 40px 50px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.6), inset 0 0 14px #0ea5e9cc;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    h1 {
      font-size: 2.7rem;
      font-weight: 900;
      text-align: center;
      color: #0ea5e9;
      text-shadow: 0 0 12px #0ea5e9dd;
      margin: 0 0 12px;
    }
    label {
      font-weight: 600;
      font-size: 1.15rem;
      color: #7dd3fc;
      display: block;
      margin-bottom: 10px;
      user-select: none;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 16px 22px;
      border-radius: 18px;
      background: #152b44;
      border: 2px solid #0284c7;
      color: #d0e8ff;
      font-size: 1.1rem;
      font-weight: 600;
      resize: vertical;
      box-shadow: inset 0 0 10px #0ea5e9bb;
      transition: border-color 0.3s ease, background 0.3s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    input:focus, textarea:focus {
      border-color: #0ea5e9;
      background: #1b3a63;
      box-shadow: 0 0 20px #0ea5e9cc;
      outline: none;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-top: 8px;
    }
    button {
      cursor: pointer;
      border-radius: 18px;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 16px 28px;
      border: 2.5px solid #0ea5e9;
      background: #0c1321;
      color: #0ea5e9;
      box-shadow: 0 0 16px #0ea5e9bb;
      transition: all 0.25s ease;
      flex: 1 1 180px;
      max-width: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      line-height: 1.2;
    }
    button:hover:not(:disabled) {
      background: #0ea5e9;
      color: #0c1321;
      box-shadow: 0 0 28px #0ea5e9ee;
      transform: translateY(-4px);
    }
    button:disabled {
      background: #3b536b;
      color: #7a8ca1;
      border-color: #7a8ca1;
      box-shadow: none;
      cursor: not-allowed;
    }
    #output-container {
      position: relative;
      background: #0c1620;
      border-radius: 20px;
      padding: 30px 40px;
      box-shadow: inset 0 0 24px #0ea5e9cc;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.1rem;
      color: #7dd3fc;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      user-select: text;
    }
    #copy-btn {
      position: absolute;
      top: 22px;
      right: 22px;
      background: #0ea5e9;
      color: white;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px #0ea5e9cc;
      transition: 0.3s ease;
      user-select: none;
      font-size: 1rem;
    }
    #copy-btn:hover {
      background: #0284c7;
      transform: scale(1.1);
    }
    @media (max-width: 640px) {
      .container {
        padding: 30px 25px;
      }
      button {
        flex: 1 1 100%;
        max-width: none;
      }
      #output-container {
        font-size: 1rem;
        max-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="container" role="main" aria-label="Prompt Generator">
    <h1>📲 Pro Prompt Generator Tool</h1>

    <div>
      <label for="title">📝 Title <span style="color:#f87171">*</span></label>
      <input type="text" id="title" placeholder="Enter your post title..." autocomplete="off" required />
    </div>

    <div>
      <label for="description">🗒️ Description <span style="color:#f87171">*</span></label>
      <textarea id="description" rows="3" placeholder="Enter a short description..." autocomplete="off" required></textarea>
    </div>

    <div>
      <label for="tags">🏷️ Hashtags (optional)</label>
      <input type="text" id="tags" placeholder="#marketing #growth #branding" autocomplete="off" />
    </div>

    <div class="btn-group" role="group" aria-label="Prompt type buttons">
      <button type="button" onclick="handleGenerate('pinterest')">📌 Pinterest</button>
      <button type="button" onclick="handleGenerate('facebook')">📘 Facebook</button>
      <button type="button" onclick="handleGenerate('instagram')">📷 Instagram</button>
      <button type="button" onclick="handleGenerate('short')">🎬 Shorts</button>
      <button type="button" onclick="handleGenerate('videoDesc')">🎥 Video Desc</button>
      <button type="button" onclick="handleGenerate('blog')">📝 Blog Post</button>
      <button type="button" onclick="handleGenerate('keyword')">🔑 Keyword</button>
    </div>

    <div id="output-container" tabindex="0" aria-live="polite" aria-label="Generated prompt output">
      <button id="copy-btn" onclick="copyPrompt()" aria-label="Copy prompt to clipboard">📋 Copy</button>
      <pre id="output"></pre>
    </div>
  </main>

  <script>
    function handleGenerate(type) {
      const title = document.getElementById("title").value.trim();
      const desc = document.getElementById("description").value.trim();
      const tags = document.getElementById("tags").value.trim() || '[#Tags]';

      if (!title || (["short", "facebook", "pinterest", "instagram"].includes(type) && !desc)) {
        alert("Please fill in the required fields.");
        return;
      }

      let prompt = "";
      switch (type) {
        case "pinterest":
          prompt = `
Pinterest Pin 1000×1500 px

Headline: “${title}”
Description: “${desc}”
Hashtags: ${tags}

Design:
- Eye-catching title on top
- High-quality visual
- Modern font, soft colors
          `.trim();
          break;

        case "facebook":
          prompt = `
Facebook Post Image (1200×630 px)

Title: “${title}”
Text: “${desc}”
Hashtags: ${tags}

Design:
- Horizontal layout
- Left-aligned text
- Clear CTA
          `.trim();
          break;

        case "instagram":
          prompt = `
Instagram Post (1080×1080 px)

Main Text: “${title}”
Description: “${desc}”
Tags: ${tags}

Style:
- Bold typography
- Bright, scroll-stopping color
- Central image or graphic
          `.trim();
          break;

        case "short":
          prompt = `
🎬 Short Video Script

Title: ${title}
Desc: ${desc}

Include:
- 25 sec max, 9:16 ratio
- No narration, only SFX + upbeat music
- Problem > Product > Happy pet
          `.trim();
          break;

        case "videoDesc":
          prompt = `
🎥 Video Description for YouTube

Title: ${title}

Hey pet lovers! 🐾 ${desc}

Order now 👉 GuardPaws.store

Tags: ${tags}
          `.trim();
          break;

        case "blog":
          prompt = `
Act as a highly skilled SEO blog writer who writes like a real human — with emotion, storytelling, personality, and clarity.

You understand how to create helpful, unique blog content that:

- Sounds fully human
- Feels emotionally engaging and personal
- Avoids robotic or repetitive tone
- Passes AI detection tools
- Is SEO-optimized using natural keyword usage

🎯 Topic:
“${title}”

Now write a complete blog post based on that title using the following structure and style:

🔹 Step-by-Step Structure:

1. ✅ Create a long-tail, SEO-friendly **Blog Title**  
   - Use low-competition, niche keywords  
   - Make it catchy, specific, and emotional if possible  

2. ✅ Write a compelling **Meta Description** (max 160 characters)  
   - Include the main keyword naturally  
   - Make it feel personal or helpful  

3. ✅ Full Blog Body with Headings:
   - **H1**: Blog Title  
   - **H2**: Introduction  
     - Start with a relatable emotion, situation, or real-life question  
     - Pull the reader in emotionally or practically  
   - **H3 / H4**: Core content sections  
     - Break into clear, helpful points  
     - Use examples, mini-stories, or analogies  
     - Use at least one **H5** heading inside a subtopic or tip list  
   - **H3 or H4**: “Comparison” or “Differences” section  
     - Bullet points or table comparing options/ideas  
   - **H2 or H3**: Conclusion  
     - Reflect on the reader’s needs  
     - Offer advice, emotional support, or a practical takeaway  

4. ✅ End with a “Bonus” section:  
   - List 3–5 low-competition keywords that were naturally used

🧠 Writing Style Guidelines:

- Use **emotion-driven language** (hope, worry, frustration, joy, care, comfort)  
- Speak **like a friend or guide**, not a formal robot  
- Vary sentence lengths and structure  
- Ask questions to the reader  
- Share possible scenarios or common thoughts people have  
- Don’t keyword stuff — keep it natural and useful  
- Paragraphs: 2–4 lines each  
- Use bullet points, bolding, and spacing for easy reading  
- Make it **feel like it was written by someone who truly cares**

📌 Final Note:
- Output should be **100% unique**  
- Must feel **human-written**, **emotionally intelligent**, and **SEO-ready**  
- Keep it helpful, warm, and engaging — like real blog content written with heart
          `.trim();
          break;

        case "keyword":
          prompt = `
You are an expert SEO keyword analyst with mastery in uncovering rare, untapped, and ultra-low competition keywords that can quickly boost new websites' rankings.

Given the content title below, perform deep semantic analysis and competitive keyword research to generate:

1. A list of exactly 20 unique short-tail keywords:
   - Highly relevant to the title
   - Extremely low competition or virtually unused
   - Clear, concise, and high potential for quick ranking

2. A list of exactly 30 unique long-tail keywords and phrases:
   - Natural, conversational, and highly targeted
   - Long, specific search queries with minimal competition
   - Suitable for attracting highly engaged niche audiences

Requirements:
- Do NOT include generic or overly broad keywords.
- Avoid common or saturated terms.
- Prioritize originality, specificity, and SEO potential.
- Present both lists clearly and separately with bullet points.
- Maintain consistent formatting for easy copy-paste.

Content Title: "${title}"

Begin the keyword generation now.
          `.trim();
          break;
      }

      document.getElementById("output").textContent = prompt;
      document.getElementById("output-container").focus();
    }

    function copyPrompt() {
      const text = document.getElementById("output").textContent;
      if (!text) return alert("No content to copy!");

      navigator.clipboard.writeText(text).then(() => {
        alert("Copied to clipboard!");
      }).catch(() => {
        alert("Copy failed.");
      });
    }
  </script>
</body>
</html>
